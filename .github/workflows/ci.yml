name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rubberband-cli
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  macos:
    # The tool's main audience runs it on a Mac: install with Homebrew tools, run the suite.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system tools
        run: brew install ffmpeg rubberband
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  ml:
    # Real models: Demucs stem separation + beat_this downbeats (CPU PyTorch, cached models).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rubberband-cli
      - name: Install package with ML extras (CPU PyTorch)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,all]"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/aislice/models
            ~/.cache/torch/hub/checkpoints
          key: aislice-models-v2
      - name: Real model tests
        env:
          AISLICE_REAL_STEMS: "1"
          AISLICE_REAL_BEATS: "1"
        run: pytest -q tests/test_stems.py tests/test_downbeats.py
